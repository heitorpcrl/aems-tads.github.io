<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEMS - Assistente de Cibersegurança</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div class="glass">
    <header class="header">
      <div class="container header-container">
        <div class="logo">
          <a href="index.html"><img src="images/aemsLogo.png" alt="Logo AEMS" /></a>
        </div>
        <nav>
          <ul class="nav-links">
            <li><a href="index.html">Início</a></li>
            <li><a href="chatbot.html" class="nav-active">Assistente</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section id="assistente" class="chat-section">
        <div class="container">
          <h1 class="section-title">Assistente AEMS</h1>
          <p class="chat-intro">
            Tire dúvidas sobre golpes, ameaças, dispositivos e boas práticas. O assistente usa a mesma base de
            conhecimento do projeto (Python / Prolog) e não orienta atividades ilegais.
          </p>
          <p id="chat-status" class="chat-status" role="status"></p>

          <div class="chat-panel">
            <div id="chat-messages" class="chat-messages" aria-live="polite"></div>

            <div class="chat-suggestions-wrap">
              <p class="chat-suggestions-label">Perguntas sugeridas</p>
              <div id="chat-suggestions" class="chat-suggestions" aria-label="Sugestões de pergunta"></div>
            </div>

            <div class="chat-input-row">
              <textarea id="chat-input" class="chat-input" rows="2"
                placeholder="Ex.: O que é phishing? Como proteger meu celular?" aria-label="Sua mensagem"></textarea>
              <div class="chat-actions">
                <button type="button" id="chat-send" class="chat-btn chat-btn-primary">
                  <span class="chat-btn-icon" aria-hidden="true">➤</span> Enviar
                </button>
                <button type="button" id="chat-clear" class="chat-btn chat-btn-secondary">Limpar chat</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>AEMS © 2025 - v1.0</p>
      </div>
    </footer>
  </div>
  <script src="chatbot.js" defer></script>
</body>

</html>
